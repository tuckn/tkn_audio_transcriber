[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tkn-audio-transcriber"
version = "0.14.2"
description = "A resumable CLI for local or Azure Speech transcription of audio and video."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Tuckn" }]
dependencies = [
  # faster-whisper passes av.open(metadata_errors=...), which PyAV 19 removed.
  "av<19",
  "azure-identity>=1.25.0,<2",
  "faster-whisper>=1.1.0,<2",
  "huggingface-hub>=0.30.0,<2",
  "httpx>=0.28.1,<1",
  "PyYAML>=6.0.2,<7",
  "tkn-genai-bridge @ https://github.com/tuckn/tkn_genai_bridge/archive/24d9d6c1ff75c2cc5ca0a0fe3ad5c455219d8bce.zip",
]

[project.scripts]
tkn-audio-transcriber = "audio_transcriber.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/audio_transcriber"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["audio_transcriber"]

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true
follow_imports = "skip"
