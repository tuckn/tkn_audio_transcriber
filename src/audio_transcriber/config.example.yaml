schema_version: "2.0.0"

transcription:
  active_profile: local-small

  profiles:
    local-small:
      provider: faster-whisper
      model: small
      language: ja
      chunk_seconds: 600
      beam_size: 1
      compute_type: int8
      device: cpu

    local-large:
      provider: faster-whisper
      model: large-v3
      language: ja
      chunk_seconds: 600
      beam_size: 1
      compute_type: int8
      device: cpu

    # Azure Speech Fast Transcription does not expose a Whisper-style model name.
    # Set the real endpoint only in a user or ignored working-directory config.
    azure-ja:
      provider: azure-speech-fast
      endpoint: null
      region: japaneast
      api_version: "2025-10-15"
      locale: ja-JP
      diarization:
        enabled: true
        max_speakers: 8
      request:
        timeout_seconds: 600
        max_retries: 3

folders:
  output: .
  local_models: ~/.cache/audio_transcriber/models
  huggingface_cache: ~/.cache/audio_transcriber/huggingface
  state: ~/.tkn/audio_transcriber/state

processing:
  ffmpeg:
    executable: ffmpeg
    timeout_seconds: 3600
  heartbeat_seconds: 60
  keep_working_files: false
