schema_version: "5.0.0"

# Folders whose new media files `pull` archives and transcribes. Relative paths
# are relative to this config file. `{year}` is the year of the file's creation
# time (its modification time where the platform records no creation time).
sources: {}
#  recordings:
#    input_dir: ~/Documents/Sound Recordings
#    include: ['*.flac', '*.m4a', '*.mp3', '*.wav']
#    min_age_seconds: 30  # Skip files written within this many seconds.
#    profile: cloud/azure-ja  # null: use transcription.profile.
#    output_dir: 'C:\path\to\transcripts\{year}'
#    archive:  # Optional. Without it, files are transcribed in place and kept.
#      dir: 'C:\path\to\recordings\{year}'
#      name: created-time  # created-time: 20260102T030405+0900.flac
#                          # created-time-original: 20260102T030405+0900_Recording.flac
#                          # original: Recording.flac
#      delete_source: false  # true: remove the input file after a verified copy
#                            # and a successful transcription.
#    correction:  # Optional. Correct each new transcript with generation.genai_profile.
#      context_files: [./vocabulary/recordings.txt]  # UTF-8 background text, such as
#                                                    # a glossary. Relative to this file.

processing:
  ffmpeg:
    executable: ffmpeg
    timeout_seconds: 3600
  heartbeat_seconds: 60
  # Final audio.flac is always retained, independently of working files.
  keep_working_files: false

transcription:
  # A profile in transcription_profiles, as local/NAME or cloud/NAME. A cloud
  # profile uploads audio derived from the media. --profile and
  # sources.<name>.profile override it.
  profile: local/local-small

folders:
  # Root for source-name/hash folders containing audio.flac and transcripts.
  # --output-dir overrides it; a source always uses its own output_dir.
  output: .
  local_models: ~/.cache/audio_transcriber/models
  huggingface_cache: ~/.cache/audio_transcriber/huggingface
  state: ~/.tkn/audio_transcriber/state

generation:
  genai_profile: codex-default  # A name in genai_profiles; --genai-profile overrides it.
  max_candidates: 30  # suggest-phrases only.

# Named transcription settings, grouped by where the audio is processed. Layers
# merge by name and field, so a later file can change one field of a profile.
# A new profile needs `provider`. A field it leaves out takes the value shown
# here for local-small (local) or azure-ja (cloud), not that of a profile with
# a similar name.
transcription_profiles:
  local:
    local-small:
      provider: faster-whisper
      model: small
      language: ja
      chunk_seconds: 600
      beam_size: 1
      compute_type: int8
      device: cpu

    local-large:
      provider: faster-whisper
      model: large-v3
      language: ja
      chunk_seconds: 600
      beam_size: 1
      compute_type: int8
      device: cpu

    gpu-quality:
      provider: faster-whisper
      model: large-v3
      language: ja
      chunk_seconds: 600
      beam_size: 5
      compute_type: float16
      device: cuda

    gpu-fast:
      provider: faster-whisper
      model: large-v3
      language: ja
      chunk_seconds: 600
      beam_size: 1
      compute_type: int8_float16
      device: cuda

  cloud:
    # Azure Speech Fast Transcription does not expose a Whisper-style model name.
    # Set the real endpoint only in a user or ignored working-directory config.
    azure-ja:
      provider: azure-speech-fast
      endpoint: null
      region: japaneast
      api_version: "2025-10-15"
      locale: ja-JP
      diarization:
        enabled: false
        max_speakers: 8
      profanity_filter_mode: "None"
      phrase_list:
        phrases: []
        # UTF-8, one phrase per line. Relative to this config file.
        files: []
      authentication:
        reuse_cached_credentials: true
      request:
        timeout_seconds: 600
        max_retries: 3

# Generative AI connections for correct and suggest-phrases, passed to
# tkn-genai-bridge as its Profile settings. The shared tkn-genai-bridge config is not read. Layers
# merge by name and field. CLI providers reuse their own sign-in; a relative
# cli.executable is relative to this config file.
genai_profiles:
  codex-default:
    provider: codex
    model: null  # null: the provider's default model.
  claude-default:
    provider: claude-code
    model: null
  copilot-default:
    provider: github-copilot
    model: null
  antigravity-default:
    provider: antigravity
    model: null
#  codex-high:
#    provider: codex
#    model: gpt-6.2-sol
#    reasoning_effort: high
#    timeout_seconds: 1800
