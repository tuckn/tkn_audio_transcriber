schema_version: "3.3.0"

# Folders whose new media files `pull` archives and transcribes. Relative paths
# are relative to this config file. `{year}` is the year of the file's creation
# time (its modification time where the platform records no creation time).
sources: {}
#  recordings:
#    input_dir: ~/Documents/Sound Recordings
#    include: ['*.flac', '*.m4a', '*.mp3', '*.wav']
#    min_age_seconds: 30  # Skip files written within this many seconds.
#    profile: cloud/azure-ja  # null: use transcription.active.
#    output_dir: 'C:\path\to\transcripts\{year}'
#    archive:  # Optional. Without it, files are transcribed in place and kept.
#      dir: 'C:\path\to\recordings\{year}'
#      name: created-time  # created-time: 20260102T030405+0900.flac
#                          # created-time-original: 20260102T030405+0900_Recording.flac
#                          # original: Recording.flac
#      delete_source: false  # true: remove the input file after a verified copy
#                            # and a successful transcription.

folders:
  # Root for source-name/hash folders containing audio.flac and transcripts.
  output: .
  local_models: ~/.cache/audio_transcriber/models
  huggingface_cache: ~/.cache/audio_transcriber/huggingface
  state: ~/.tkn/audio_transcriber/state

processing:
  ffmpeg:
    executable: ffmpeg
    timeout_seconds: 3600
  heartbeat_seconds: 60
  # Final audio.flac is always retained, independently of working files.
  keep_working_files: false

transcription:
  active:
    mode: local
    profile: local-small

  local:
    provider: faster-whisper
    profiles:
      local-small:
        model: small
        language: ja
        chunk_seconds: 600
        beam_size: 1
        compute_type: int8
        device: cpu

      local-large:
        model: large-v3
        language: ja
        chunk_seconds: 600
        beam_size: 1
        compute_type: int8
        device: cpu

      gpu-quality:
        model: large-v3
        language: ja
        chunk_seconds: 600
        beam_size: 5
        compute_type: float16
        device: cuda

      gpu-fast:
        model: large-v3
        language: ja
        chunk_seconds: 600
        beam_size: 1
        compute_type: int8_float16
        device: cuda

  cloud:
    provider: azure-speech-fast
    profiles:
      # Azure Speech Fast Transcription does not expose a Whisper-style model name.
      # Set the real endpoint only in a user or ignored working-directory config.
      azure-ja:
        endpoint: null
        region: japaneast
        api_version: "2025-10-15"
        locale: ja-JP
        diarization:
          enabled: false
          max_speakers: 8
        profanity_filter_mode: "None"
        phrase_list:
          phrases: []
          # UTF-8, one phrase per line. Relative to this config file.
          files: []
        authentication:
          reuse_cached_credentials: true
        request:
          timeout_seconds: 600
          max_retries: 3

generation:
  active_profile: codex
  profiles:
    codex:
      bridge_profile: codex-default
  max_candidates: 30
