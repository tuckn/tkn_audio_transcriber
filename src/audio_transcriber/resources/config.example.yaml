schema_version: "3.0.0"

transcription:
  active:
    mode: local
    profile: local-small

  local:
    provider: faster-whisper
    profiles:
      local-small:
        model: small
        language: ja
        chunk_seconds: 600
        beam_size: 1
        compute_type: int8
        device: cpu

      local-large:
        model: large-v3
        language: ja
        chunk_seconds: 600
        beam_size: 1
        compute_type: int8
        device: cpu

      gpu-quality:
        model: large-v3
        language: ja
        chunk_seconds: 600
        beam_size: 5
        compute_type: float16
        device: cuda

      gpu-fast:
        model: large-v3
        language: ja
        chunk_seconds: 600
        beam_size: 1
        compute_type: int8_float16
        device: cuda

  cloud:
    provider: azure-speech-fast
    profiles:
      # Azure Speech Fast Transcription does not expose a Whisper-style model name.
      # Set the real endpoint only in a user or ignored working-directory config.
      azure-ja:
        endpoint: null
        region: japaneast
        api_version: "2025-10-15"
        locale: ja-JP
        diarization:
          enabled: false
          max_speakers: 8
        profanity_filter_mode: "None"
        phrase_list:
          phrases: []
        authentication:
          reuse_cached_credentials: true
        request:
          timeout_seconds: 600
          max_retries: 3

folders:
  output: .
  local_models: ~/.cache/audio_transcriber/models
  huggingface_cache: ~/.cache/audio_transcriber/huggingface
  state: ~/.tkn/audio_transcriber/state

processing:
  ffmpeg:
    executable: ffmpeg
    timeout_seconds: 3600
  heartbeat_seconds: 60
  keep_working_files: false
